<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC AI 助理</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    padding: 18px 24px;
    background: #111827;
    border-bottom: 1px solid #334155;
    font-size: 24px;
    font-weight: bold;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px 120px;
}

.message {
    max-width: 900px;
    margin: 0 auto 24px;
    padding: 18px;
    border-radius: 16px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
}

.user {
    background: #2563eb;
}

.bot {
    background: #1e293b;
    border: 1px solid #334155;
}

.input-area {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 12px;
    padding: 20px;
    background: #111827;
    border-top: 1px solid #334155;
}

input {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    outline: none;
    background: #1e293b;
    color: white;
}

button {
    border: none;
    border-radius: 14px;
    padding: 16px 24px;
    background: #22c55e;
    color: white;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

button:hover {
    background: #16a34a;
}

button:disabled {
    background: #64748b;
    cursor: not-allowed;
}

.result-image {
    width: 100%;
    max-width: 760px;
    display: block;
    border-radius: 14px;
    border: 1px solid #475569;
    margin-top: 18px;
    background: #0f172a;
}

.image-title {
    margin-top: 25px;
    margin-bottom: 10px;
    color: #fde047;
    font-size: 18px;
    font-weight: bold;
}

.loading {
    opacity: 0.75;
}

.small-note {
    font-size: 14px;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="header">🔧 CNC AI 助理</div>

<div class="chat" id="chat">
    <div class="message bot">
你好，我是 CNC AI 助理。

你可以直接輸入：

231-E018

或：

G02 是什麼？
    </div>
</div>

<div class="input-area">
    <input
        id="query"
        placeholder="輸入錯誤代碼或問題..."
        onkeydown="handleKey(event)"
        autocomplete="off"
    >
    <button id="sendBtn" onclick="sendMessage()">送出</button>
</div>

<script>
const API_URL = "/search";

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function addMessage(html, type) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "message " + type;
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

function handleKey(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

async function sendMessage() {
    const input = document.getElementById("query");
    const button = document.getElementById("sendBtn");
    const q = input.value.trim();

    if (!q) return;

    addMessage(escapeHtml(q), "user");

    input.value = "";
    button.disabled = true;

    const loading = addMessage("🔍 搜尋中...", "bot loading");

    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000);

        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                query: q
            }),
            signal: controller.signal
        });

        clearTimeout(timeout);

        if (!res.ok) {
            loading.innerHTML = `API 錯誤：${res.status}`;
            loading.classList.remove("loading");
            return;
        }

        const data = await res.json();
        console.log("API response:", data);

        if (data.error) {
            loading.innerHTML = `系統錯誤：<br>${escapeHtml(data.error)}`;
            loading.classList.remove("loading");
            return;
        }

        if (!data.count || data.count === 0) {
            loading.innerHTML = "查無相關資料";
            loading.classList.remove("loading");
            return;
        }

        let html = "";

        html += `<div>${escapeHtml(data.answer || "查到資料，但沒有生成回答。")}</div>`;

        if (data.images && data.images.length > 0) {
            html += `<div class="image-title">相關手冊圖片：</div>`;

            for (const img of data.images) {
                html += `
<img
    src="${img}"
    class="result-image"
    loading="lazy"
    onerror="this.insertAdjacentHTML('afterend','<div class=&quot;small-note&quot;>圖片讀取失敗：${img}</div>'); this.style.display='none';"
>
`;
            }
        }

        loading.innerHTML = html;
        loading.classList.remove("loading");

    } catch (err) {
        console.error(err);

        if (err.name === "AbortError") {
            loading.innerHTML = "請求超時，Render 免費版可能正在喚醒，請再試一次。";
        } else {
            loading.innerHTML = "API 連線失敗，請確認 Render 後端是否正常。";
        }

        loading.classList.remove("loading");

    } finally {
        button.disabled = false;
        input.focus();
    }
}
</script>

</body>
</html>
