<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CNC AI 助理</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    padding:18px 24px;
    background:#111827;
    border-bottom:1px solid #334155;
    font-size:24px;
    font-weight:bold;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 20px;
}

.message{
    max-width:900px;
    margin:auto;
    margin-bottom:24px;
    padding:18px;
    border-radius:16px;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
}

.user{
    background:#2563eb;
}

.bot{
    background:#1e293b;
    border:1px solid #334155;
}

.input-area{
    display:flex;
    gap:12px;
    padding:20px;
    background:#111827;
    border-top:1px solid #334155;
}

input{
    flex:1;
    padding:16px;
    border:none;
    border-radius:14px;
    font-size:16px;
    outline:none;
    background:#1e293b;
    color:white;
}

button{
    border:none;
    border-radius:14px;
    padding:16px 24px;
    background:#22c55e;
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    background:#16a34a;
}

.result-image{
    width:100%;
    max-width:700px;
    border-radius:14px;
    border:1px solid #475569;
    margin-top:18px;
}

.image-title{
    margin-top:25px;
    margin-bottom:10px;
    font-size:18px;
    font-weight:bold;
}

.loading{
    opacity:0.7;
}

</style>

</head>

<body>

<div class="header">
🔧 CNC AI 助理
</div>

<div
    class="chat"
    id="chat"
>

<div class="message bot">

你好，我是 CNC AI 助理。

你可以直接輸入：

231-E018

或：

G02 是什麼？

</div>

</div>

<div class="input-area">

<input
    id="query"
    placeholder="輸入錯誤代碼或問題..."
    onkeydown="handleKey(event)"
>

<button onclick="sendMessage()">
送出
</button>

</div>

<script>

const API_URL = "/search";

function addMessage(text,type){

    const chat=document.getElementById("chat");

    const div=document.createElement("div");

    div.className="message "+type;

    div.innerHTML=text;

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;

    return div;
}

function handleKey(event){

    if(event.key==="Enter"){

        sendMessage();
    }
}

async function sendMessage(){

    const input=document.getElementById("query");

    const q=input.value.trim();

    if(!q)return;

    addMessage(q,"user");

    input.value="";

    const loading=addMessage(
        "🔍 AI 搜尋中...",
        "bot loading"
    );

    try{

        const controller=new AbortController();

        const timeout=setTimeout(()=>{

            controller.abort();

        },30000);

        const res=await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                query:q
            }),

            signal:controller.signal
        });

        clearTimeout(timeout);

        if(!res.ok){

            loading.innerHTML=
            `API錯誤：${res.status}`;

            return;
        }

        const data=await res.json();

        console.log(data);

        if(data.error){

            loading.innerHTML=
            `系統錯誤：<br>${data.error}`;

            return;
        }

        if(data.count===0){

            loading.innerHTML=
            "查無相關資料";

            return;
        }

        let html="";

        html+=`
        <div>
        ${data.answer}
        </div>
        `;

        if(data.images && data.images.length>0){

            html+=`
            <div class="image-title">
            相關圖片：
            </div>
            `;

            for(const img of data.images){

                html+=`
                <img
                    src="${img}"
                    class="result-image"
                    loading="lazy"
                >
                `;
            }
        }

        loading.classList.remove("loading");

        loading.innerHTML=html;

    }catch(err){

        console.error(err);

        if(err.name==="AbortError"){

            loading.innerHTML=
            "請求超時（Render 免費版可能正在喚醒）";

        }else{

            loading.innerHTML=
            "API連線失敗";
        }
    }
}

</script>

</body>
</html>
